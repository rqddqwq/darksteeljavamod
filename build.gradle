apply plugin: "java"

sourceSets.main.java.srcDirs = ["src"]

ext{
    mindustryVersion = "v160"
    isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
    sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
}

repositories{
    mavenCentral()

    ivy{
        url = 'https://github.com/'
        patternLayout{ artifact(
            (mindustryVersion == "latest" ? '/[organisation]/[module]/releases/[revision]/download/dependencies.jar' :
            mindustryVersion == "be" ? '/[organisation]/[module]/releases/download/master/[revision].jar' :
            '/[organisation]/[module]/releases/download/[revision]/dependencies.jar'))
        }
        metadataSources{ artifact() }

        content{
            if(mindustryVersion == "be"){
                includeVersion("Anuken", "MindustryBuilds", "latest")
            }else{
                includeVersion("Anuken", "Mindustry", mindustryVersion)
            }
        }
    }
}

java{
    targetCompatibility = JavaVersion.VERSION_17
    sourceCompatibility = JavaVersion.VERSION_17
}

dependencies {
     compileOnly mindustryVersion == 'be' ? 'Anuken:MindustryBuilds:latest' : "Anuken:Mindustry:$mindustryVersion"
     compileOnly 'com.github.EB-wilson:TooManyItems:3.2'
 }
 jar {
     archiveFileName = "${project.name}Desktop.jar"
     from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
     from (layout.projectDirectory.files('mod.json', 'mod.hjson', 'icon.png'))
 }
tasks.register('jarAndroid'){
    dependsOn "jar"
    def projectName = project.name
    def sdk = providers.environmentVariable('ANDROID_HOME').orElse(providers.environmentVariable('ANDROID_SDK_ROOT')).orNull
    def win = providers.systemProperty('os.name').get().toLowerCase().contains("windows")

    doLast{
        if(!sdk || !new File(sdk).exists()){
            logger.lifecycle("SDK missing, skip jarAndroid")
            return
        }

        def platformRoot = new File("$sdk/platforms/").listFiles().sort().reverse().find{ f -> new File(f, "android.jar").exists() }
        if(!platformRoot){
            logger.lifecycle("No android.jar, skip jarAndroid")
            return
        }

        def dependencies = (configurations.compileClasspath.asList() + configurations.runtimeClasspath.asList() + [new File(platformRoot, "android.jar")])
                .collect{ "--classpath \"${it.path}\"" }.join(" ")

        def d8 = win ? "d8.bat" : "d8"
        def cmd = "$d8 $dependencies --min-api 21 --output ${projectName}Android.jar ${projectName}Desktop.jar"
        cmd.execute(null, new File("build/libs")).waitForProcessOutput(System.out, System.err)
    }
}

jar{
    archiveFileName = "${project.name}Desktop.jar"

    from{
        configurations.runtimeClasspath.collect{ it.isDirectory() ? it : zipTree(it) }
    }

    from(projectDir){
        include "mod.hjson"
    }

    from("assets/"){
        include "**"
    }
}

tasks.register('deploy', Jar){
    def projectName = project.name
    dependsOn jarAndroid
    dependsOn jar
    archiveFileName = "${projectName}.jar"

    from{ [zipTree("build/libs/${projectName}Desktop.jar"), zipTree("build/libs/${projectName}Android.jar")] }

    doLast{
        delete "build/libs/${projectName}Android.jar"
    }
}
