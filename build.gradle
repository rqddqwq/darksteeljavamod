plugins { id 'java' }

import javax.inject.Inject
interface Injected { @Inject ExecOperations getExecOperations() }

group = 'darksteel'
version = '1.5.2'

def mindustryVersion = 'v159'
def mindustryGameVersion = 'v159.7'

java {
    targetCompatibility = JavaVersion.VERSION_17
    sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()

    ivy {
        url = 'https://github.com/'
        patternLayout {
            artifact(
                (mindustryVersion == 'latest'
                    ? '/[organisation]/[module]/releases/[revision]/download/dependencies.jar'
                    : mindustryVersion == 'be'
                        ? '/[organisation]/[module]/releases/download/master/[revision].jar'
                        : '/[organisation]/[module]/releases/download/[revision]/dependencies.jar'))
        }
        metadataSources { artifact() }
        content {
            if (mindustryVersion == 'be') includeVersion("Anuken", "MindustryBuilds", "latest")
            else includeVersion("Anuken", "Mindustry", mindustryVersion)
        }
    }

    maven { url = 'https://jitpack.io' }
}

sourceSets {
    testMod {
        java.srcDirs = ['src']
        resources.srcDirs = ['assets']
    }
}

dependencies {
    compileOnly mindustryVersion == 'be' ? 'Anuken:MindustryBuilds:latest' : "Anuken:Mindustry:$mindustryVersion"
    compileOnly 'com.github.EB-wilson:TooManyItems:3.2'

    testModImplementation sourceSets.main.output
    testModCompileOnly mindustryVersion == 'be' ? 'Anuken:MindustryBuilds:latest' : "Anuken:Mindustry:$mindustryVersion"
}

// 桌面版 JAR
jar {
    archiveFileName = "${project.name}Desktop.jar"
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    from (layout.projectDirectory.files('mod.json', 'mod.hjson', 'icon.png'))
}

// Android 版 JAR（通过 d8 把桌面 JAR 转换为 dex）
tasks.register('jarAndroid') {
    dependsOn jar

    def compileClasspath = configurations.compileClasspath
    def runtimeClasspath = configurations.runtimeClasspath
    def desktopJarFile = layout.buildDirectory.file("libs/${project.name}Desktop.jar")
    def androidJarFile = layout.buildDirectory.file("libs/${project.name}Android.jar")

    // 使用 provider 延迟获取，避免 configuration cache 问题
    def sdkRoot = providers.environmentVariable('ANDROID_HOME')
            .orElse(providers.environmentVariable('ANDROID_SDK_ROOT'))
    def isWindows = providers.systemProperty('os.name').get().toLowerCase().contains('win')

    inputs.files(compileClasspath, runtimeClasspath, desktopJarFile)
    outputs.file(androidJarFile)

    def injected = objects.newInstance(Injected)

    doLast {
        def sdk = sdkRoot.orNull
        if (!sdk || !new File(sdk).exists())
            throw new GradleException('未找到有效的 Android SDK，请设置 ANDROID_HOME 或 ANDROID_SDK_ROOT 环境变量。')

        def platformRoot = new File("$sdk/platforms/").listFiles()?.sort()?.reverse()
                ?.find { f -> new File(f, 'android.jar').exists() }
        if (!platformRoot)
            throw new GradleException('未找到 android.jar，请安装至少一个 Android Platform。')

        def dependencies = (compileClasspath.asList() + runtimeClasspath.asList()
                + [new File(platformRoot, 'android.jar')])
                .collectMany { ['--classpath', it.path] }

        androidJarFile.get().asFile.parentFile.mkdirs()

        injected.execOperations.exec {
            commandLine isWindows ? 'd8.bat' : 'd8'
            args dependencies
            args '--min-api', '14'
            args '--output', androidJarFile.get().asFile.absolutePath
            args desktopJarFile.get().asFile.absolutePath
            workingDir new File('build/libs')
            standardOutput = System.out
            errorOutput = System.err
        }
    }
}

// 最终打包（同时包含桌面和 Android 两个 dex，Mindustry 会按平台选择）
tasks.register('deploy', Jar) {
    dependsOn jarAndroid, jar
    archiveFileName = "${project.name}.jar"

    def desktopJarFile = layout.buildDirectory.file("libs/${project.name}Desktop.jar")
    def androidJarFile = layout.buildDirectory.file("libs/${project.name}Android.jar")

    from(desktopJarFile.map { zipTree(it) })
    from(androidJarFile.map { zipTree(it) })

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// 单独打包测试模组
tasks.register('jarTest', Jar) {
    archiveFileName = "${project.name}-test.jar"
    from sourceSets.testMod.output
}

// 游戏运行相关
def gameFile = layout.projectDirectory.file('run/Mindustry.jar')
def gameDataDir = layout.projectDirectory.dir('run/data')

tasks.register('downloadGame') {
    outputs.file(gameFile)
    doLast {
        def url = "https://github.com/Anuken/Mindustry/releases/download/${mindustryGameVersion}/Mindustry.jar"
        def targetFile = gameFile.asFile
        targetFile.parentFile.mkdirs()
        if (targetFile.exists() && targetFile.length() > 0) return
        URI.create(url).toURL().withInputStream { input ->
            targetFile.withOutputStream { output -> output << input }
        }
    }
}

tasks.register('copyLibToMods', Copy) {
    from deploy into gameDataDir.dir('mods') rename { "${project.name}.jar" }
}

tasks.register('copyTestToMods', Copy) {
    dependsOn jarTest
    from jarTest into gameDataDir.dir('mods') rename { "${project.name}-test.jar" }
}

tasks.register('removeMods', Delete) {
    delete gameDataDir.file("mods/${project.name}.jar")
    delete gameDataDir.file("mods/${project.name}-test.jar")
}

tasks.register('run', JavaExec) {
    dependsOn 'downloadGame', 'copyLibToMods', 'copyTestToMods'
    environment 'MINDUSTRY_DATA_DIR', gameDataDir.asFile.absolutePath
    classpath = files(gameFile)
    mainClass = 'mindustry.desktop.Mindustry'
}

tasks.register('runMobile', JavaExec) {
    dependsOn 'downloadGame', 'copyLibToMods', 'copyTestToMods'  // 修正拼写
    environment 'MINDUSTRY_DATA_DIR', gameDataDir.asFile.absolutePath
    classpath = files(gameFile)
    mainClass = 'mindustry.desktop.Mindustry'
    args '-testMobile'
}

tasks.register('runNoMod', JavaExec) {
    dependsOn 'downloadGame', 'removeMods'
    environment 'MINDUSTRY_DATA_DIR', gameDataDir.asFile.absolutePath
    classpath = files(gameFile)
    mainClass = 'mindustry.desktop.Mindustry'
}